name: Publish to PyPI

# Publishes the sdist and wheel when a GitHub release is published, with PyPI's trusted publishing
# (OIDC): no API token is stored. PyPI trusts this repository, this file (publish.yml) and the
# `pypi` environment; renaming either breaks the trust until it is updated on PyPI.
#
# workflow_dispatch publishes an existing tag (e.g. a release made before this workflow existed).
# Run it from main and name the tag: the tag's own tree is built, whatever it contains.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0"
        required: true

jobs:
  # ---- Build: the tag's sdist and wheel, checked before anything is uploaded -----------------
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check --strict dist/*

      # A tag that disagrees with pyproject.toml would publish the wrong number for good: PyPI
      # never lets a version be uploaded twice.
      - name: Check the version matches the tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag: $TAG, pyproject.toml: $version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---- Publish: the only job that can mint the PyPI token -----------------------------------
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/swmmbuilder
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
