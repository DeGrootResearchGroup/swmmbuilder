[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swmmbuilder"
version = "0.2.0"
description = "A tool manipulating GIS data files to produce sewer subnetworks and .inp files for pyswmm."
license = "MIT"
license-files = ["LICENCE"]
authors = [{name = "Anthony Sherratt", email="asherra@uwo.ca"}, {name = "Christopher DeGroot", email="christopher.degroot@uwo.ca"},]
maintainers = [{name = "Anthony Sherratt", email="asherra@uwo.ca"}, {name = "Christopher DeGroot", email="christopher.degroot@uwo.ca"},]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas",
  "networkx",
  "pyproj",
  "matplotlib",
  "shapely>=2",
]

[project.optional-dependencies]
# Web-tile basemaps (maps.add_basemap), interactive maps (maps.to_leaflet) and the deprecated
# Google Maps export (maps.generate_gmap).
maps = ["contextily", "xyzservices", "folium", "gmplot"]
# Running the written .inp files. swmmbuilder itself never imports pyswmm, and pyswmm pulls in
# julian, an sdist-only package that fails to build on some Python 3.13 setups, so it is optional.
simulate = ["pyswmm"]
# `lint` pins the linter (same series as aquakin) so a new ruff release cannot turn the gate red
# without a deliberate bump.
lint = ["ruff>=0.15,<0.16"]
test = [
  "pytest>=7",
  "pytest-timeout>=2",
  "pytest-cov>=5",
  "folium",
  "gmplot",
  "pyswmm",
]

[tool.setuptools]
packages = ["swmmbuilder"]

[tool.setuptools.package-data]
# The default .inp template and the schema presets, loaded with importlib.resources.
swmmbuilder = ["templates/*.inp", "schemas/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
#   E,W  pycodestyle   F  pyflakes   I  isort   B  flake8-bugbear   RUF  ruff-specific   UP  pyupgrade
select = ["E", "F", "W", "I", "B", "RUF", "UP"]
ignore = [
    # `ruff format` owns line width; what it can't split (strings, URLs) is noise.
    "E501",
    # --- deferred to the open issues that rewrite this code (remove the ignore in that PR) ---
    "RUF005",  # list concatenation in tests
]
