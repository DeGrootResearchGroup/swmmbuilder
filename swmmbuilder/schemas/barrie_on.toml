# Barrie, ON: the Sanitary Pipes dataset of the City of Barrie Open Data portal
# (https://gispublic.barrie.ca/arcgis/rest/services/Open_Data/SanitaryInfrastructure/MapServer/2).
# Sizes are WIDTH and HEIGHT (equal for circular pipes). Both published ELLIPSE pipes are wider
# than they are tall, so ELLIPSE is taken to be a horizontal ellipse. TYPE is used as the flow
# type, so that force mains (FORCE) are dropped by the default flow-type filter; the Storm Linear
# dataset has the same columns but other TYPE codes, so this schema is for the sanitary pipes. An
# invert of 0 means none. Lengths are computed from the geometry, reprojected to UTM zone 17N
# (EPSG:26917, metres).
name = "Barrie, ON"
nonpositive_inverts_missing = true
size_unit = "mm"
crs = "EPSG:26917"

[columns]
pipe_id = "ASSETID"
from_node = "FROM_ID"
to_node = "TO_ID"
us_invert = "INV_UP_ELV"
ds_invert = "INV_DN_ELV"
shape = "PIPESHP"
diameter = "WIDTH"
height = "HEIGHT"
width = "WIDTH"
flow_type = "TYPE"
material = "MATERIAL"

[shapes]
CIRCULAR = "CIRCULAR"
CLOSED_RECT = "RECT_CLOSED"
ELLIPSE = "HORIZ_ELLIPSE"

[flow_types]
LOCAL = "sanitary"
TRUNK = "sanitary"
