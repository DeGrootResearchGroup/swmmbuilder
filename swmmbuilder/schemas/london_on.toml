# London, ON. In the London GIS, PipeShape 'R' means round; rectangular pipes are 'REC'. Sizes
# are in mm, an invert of 0 means none, and a node ID of 'Abandoned' means no node.
#
# Older exports flag abandoned pipes in an Abandoned column; newer ones (2025 on) have
# ConstructedStatus, StructureType and the inventory types of both end nodes instead. Both load
# with this schema. The node layers (maintenance holes, Pumping_Stations, Sewer_Outfalls and
# Sewer_Other_Nodes) share GIS_FeatureKey as the node ID; rims below 150 m or above 350 m are
# data errors.
name = "London, ON"
abandoned = "Abandoned"
abandoned_values = [1]
null_nodes = ["Abandoned"]
nonpositive_inverts_missing = true
size_unit = "mm"
rim_range = [150.0, 350.0]

[columns]
pipe_id = "OBJECTID"
from_node = "UpstreamID"
to_node = "DownstreamID"
length = "Length"
us_invert = "UpstreamInvert"
ds_invert = "DownstreamInvert"
drop_invert = "DropStructureInvert"
shape = "PipeShape"
diameter = "Diameter"
height = "Height"
width = "Width"
flow_type = "FlowType"
material = "Material"
status = "ConstructedStatus"
structure_type = "StructureType"
us_node_type = "UpstreamInventoryType"
ds_node_type = "DownstreamInventoryType"

[shapes]
R = "CIRCULAR"
Round = "CIRCULAR"
REC = "RECT_CLOSED"
EGG = "EGG"
ARC = "ARCH"
ELH = "HORIZ_ELLIPSE"
ELV = "VERT_ELLIPSE"

[flow_types]
SAN = "sanitary"
STM = "storm"
COM = "combined"

[statuses]
Built = "built"
Abandoned = "abandoned"
Proposed = "proposed"
Removed = "removed"

[structure_types]
SL = "gravity"
OVF = "overflow"
FM = "force_main"

[node_types]
MH = "maintenance_hole"
PS = "pump_station"
OF = "outfall"
CAP = "cap"
TEE = "tee"
CHM = "chamber"

[node_columns]
node_id = "GIS_FeatureKey"
node_type = "StructureType"
name = "Fullname"
invert = "PipeInvert"
rim_elevation = ["LidElevation", "HeadwallElevation"]
depth = "Depth"
has_drop = "DropStructures"
overflow = "Overflow"
weir = "Weir"
pipes_in = "PipesIn"
pipes_out = "PipesOut"
flow_monitor = "FlowMonitor"
access = "Location"
verified = "Verified"

# City of London Design Specifications & Requirements Manual, used only when passed to the .inp
# writer, e.g. to_inp(..., force_main_discharge=LONDON_ON.design["force_main_discharge"]).
[design.force_main_discharge]
# Ch. 4, s. 4.8: force mains enter the gravity system not more than 200 mm above the flow line of
# the receiving maintenance hole.
max_height_above_receiving_invert = 0.2
