# London, ON. In the London GIS, PipeShape 'R' means round; rectangular pipes are 'REC'. Sizes
# are in mm, an invert of 0 means none, and a node ID of 'Abandoned' means no node.
#
# Older exports flag abandoned pipes in an Abandoned column; newer ones (2025 on) have
# ConstructedStatus, StructureType and the inventory types of both end nodes instead. Both load
# with this schema. The node layers (maintenance holes, Pumping_Stations, Sewer_Outfalls and
# Sewer_Other_Nodes) share GIS_FeatureKey as the node ID; rims below 150 m or above 350 m are
# data errors.
#
# The City's GeoJSON is in WGS 84; it is reprojected to UTM zone 17N (EPSG:2958, NAD83(CSRS),
# metres), so that missing lengths can be computed and the .inp coordinates are in metres.
name = "London, ON"
abandoned = "Abandoned"
abandoned_values = [1]
null_nodes = ["Abandoned"]
nonpositive_inverts_missing = true
size_unit = "mm"
rim_range = [150.0, 350.0]
crs = "EPSG:2958"

[columns]
pipe_id = "OBJECTID"
from_node = "UpstreamID"
to_node = "DownstreamID"
length = "Length"
us_invert = "UpstreamInvert"
ds_invert = "DownstreamInvert"
drop_invert = "DropStructureInvert"
shape = "PipeShape"
diameter = "Diameter"
height = "Height"
width = "Width"
flow_type = "FlowType"
material = "Material"
status = "ConstructedStatus"
structure_type = "StructureType"
us_node_type = "UpstreamInventoryType"
ds_node_type = "DownstreamInventoryType"

[shapes]
R = "CIRCULAR"
Round = "CIRCULAR"
REC = "RECT_CLOSED"
EGG = "EGG"
ARC = "ARCH"
ELH = "HORIZ_ELLIPSE"
ELV = "VERT_ELLIPSE"

[flow_types]
SAN = "sanitary"
STM = "storm"
COM = "combined"

[statuses]
Built = "built"
Abandoned = "abandoned"
Proposed = "proposed"
Removed = "removed"

[structure_types]
SL = "gravity"
OVF = "overflow"
FM = "force_main"

[node_types]
MH = "maintenance_hole"
PS = "pump_station"
OF = "outfall"
CAP = "cap"
TEE = "tee"
CHM = "chamber"

[node_columns]
node_id = "GIS_FeatureKey"
node_type = "StructureType"
name = "Fullname"
invert = "PipeInvert"
rim_elevation = ["LidElevation", "HeadwallElevation"]
depth = "Depth"
has_drop = "DropStructures"
overflow = "Overflow"
weir = "Weir"
pipes_in = "PipesIn"
pipes_out = "PipesOut"
flow_monitor = "FlowMonitor"
access = "Location"
verified = "Verified"

# City of London Design Specifications & Requirements Manual, used only when passed to the .inp
# writer, e.g. to_inp(..., force_main_discharge=LONDON_ON.design["force_main_discharge"]).
[design.force_main_discharge]
# Ch. 4, s. 4.8: force mains enter the gravity system not more than 200 mm above the flow line of
# the receiving maintenance hole.
max_height_above_receiving_invert = 0.2

[design.force_main_roughness]
# Ch. 4, s. 4.8: force-main Hazen-Williams C by diameter, regardless of material: 100-150 mm 100,
# 200-250 mm 110, 300-600 mm 120, over 600 mm 130. Rows are (upper diameter in mm, C).
equation = "H-W"
by = "diameter"
table = [[150, 100], [250, 110], [600, 120], [inf, 130]]

[design.wet_well_defaults]
# Ch. 4, s. 4.3.10: at least 30 min filling time at design average flow (from the firm-capacity
# start to bypass); high water level 300 mm below the inlet sewer invert; low water level at least
# 300 mm (or twice the suction diameter, for a station given its suction_diameter) above the pump
# volute centreline, taken as the wet well floor. fill_time in minutes, levels in m.
fill_time = 30
high_level_below_inlet = 0.3
low_level_above_pump = 0.3
low_level_suction_diameters = 2

[design.force_main_checks]
# Ch. 4: force mains at least 100 mm; velocity 0.6-3.0 m/s (cleansing velocity 0.9 m/s). Checks
# that give warnings, not rules. min_diameter in mm, velocity (min, max) in m/s.
min_diameter = 100
velocity = [0.6, 3.0]

[design.default_pump]
# s. 4.3.5: pumps deliver "as uniform a flow as practicable" at varying rates (variable speed), so
# an ideal pump that passes its inflow on is the default for stations given without a pump.
curve = "*"
